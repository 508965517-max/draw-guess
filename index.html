<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>你画我猜 · 随时可玩版</title>
  <link rel="stylesheet" href="style.css?v=1029c" />
</head>
<body>
  <!-- 进入房间界面 -->
  <div id="lobby" class="screen">
    <div class="card">
      <h1>🎨 你画我猜</h1>
      <p class="sub">随时随地在手机/电脑上和朋友一起玩</p>
      <input id="nameInput" maxlength="12" placeholder="输入你的昵称" />
      <div class="row">
        <input id="roomNameInput" maxlength="20" placeholder="房间名（可选，自己起名更好记）" />
      </div>
      <div class="row">
        <input id="codeInput" maxlength="20" placeholder="房间号（加入时填）" />
      </div>
      <div class="row bot-cfg">
        <label>机器人性格（仅单人模式生效）
          <select id="botPersonality">
            <option value="chatty">话痨型 · 话多误猜多</option>
            <option value="instant">秒猜型 · 又快又准</option>
          </select>
        </label>
      </div>
      <div class="btn-row">
        <button id="soloBtn" class="primary">🤖 单人模式</button>
        <button id="createBtn">👥 创建房间(多人)</button>
      </div>
      <div class="btn-row">
        <button id="joinBtn">加入房间</button>
      </div>
      <p id="lobbyMsg" class="msg"></p>
      <p class="tip">
        • <b>单人模式</b>：只有你和机器人，轮流作画 / 猜词，一个人也能玩 🤖（无需联网）<br/>
        • <b>创建房间(多人)</b>：纯多人，不会有机器人；可在昵称下自定义<b>房间名</b>，创建后点顶栏 🔗 复制邀请链接发给朋友。<br/>
        • <b>加入房间</b>：直接打开朋友发来的邀请链接，房间号会自动填好，输入昵称即可进。<br/>
        • 网站托管在 GitHub Pages，<b>永远在线</b>，手机电脑都能直接打开。
      </p>
    </div>
  </div>

  <!-- 游戏主界面 -->
  <div id="game" class="screen hidden">
    <header class="topbar">
      <div class="room">房间 <b id="roomCode">----</b><button id="inviteBtn" class="mini hidden" title="复制邀请链接">🔗 邀请</button></div>
      <div class="round" id="roundInfo">等待开始</div>
      <div class="timer" id="timer">--</div>
    </header>

    <div class="main">
      <section class="board-wrap">
        <div class="word-bar">
          <span id="wordStatus">等待开始…</span>
        </div>
        <canvas id="board" width="900" height="600"></canvas>
        <div class="tools" id="tools">
          <div class="colors" id="colors"></div>
          <label class="custom-color">自定义<input type="color" id="customColor" value="#111111" /></label>
          <div class="sizes">
            <button data-size="4">细</button>
            <button data-size="10" class="active">中</button>
            <button data-size="22">粗</button>
          </div>
          <button id="eraserBtn">橡皮</button>
          <button id="clearBtn">清空</button>
          <button id="newWordBtn">换词</button>
        </div>
      </section>

      <aside class="side">
        <h3>玩家（<span id="playerCount">0</span>）</h3>
        <ul id="playerList"></ul>
        <div class="chat-box">
          <div id="chatLog"></div>
          <div class="guess-row">
            <input id="guessInput" maxlength="20" placeholder="输入你猜的词…" />
            <button id="sendBtn">发送</button>
          </div>
        </div>
        <button id="exitBtn" class="ghost hidden">退出房间</button>
        <div class="host-actions" id="hostActions">
          <label>回合数
            <select id="roundsSelect">
              <option value="5">5 轮</option>
              <option value="8">8 轮</option>
              <option value="10">10 轮</option>
            </select>
          </label>
          <button id="startBtn" class="primary">开始游戏</button>
          <button id="restartBtn" class="hidden">再来一局</button>
          <button id="dissolveBtn" class="danger hidden">解散房间</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- 加入房间确认弹窗 -->
  <div id="joinModal" class="modal-mask hidden">
    <div class="modal">
      <h3>加入房间确认</h3>
      <p class="modal-room">房间：<b id="joinRoomName">----</b></p>
      <p class="modal-sub">房间内成员（确认是不是对的房间）：</p>
      <ul id="joinMembers" class="join-members"></ul>
      <div class="modal-btns">
        <button id="joinRejectBtn" class="ghost">拒绝</button>
        <button id="joinAcceptBtn" class="primary">加入</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script>if (!window.mqtt) document.write('<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"><\/script>');</script>
  <script src="words.js?v=1029c"></script>
  <script src="doodles.js?v=1029c"></script>
  <script src="client.js?v=1029c"></script>
</body>
</html>
